version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      test-tooling:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
  - package-ecosystem: cargo
    directories:
      - /tools/parity/rust_probe
      - /benchmarks/rust
    schedule:
      interval: weekly
      day: monday
