name: Publish to NuGet

on:
  workflow_dispatch:
    inputs:
      package_version:
        description: "NuGet package version to pack or publish"
        required: true
        default: "0.4.0"
      publish_to_nuget:
        description: "Push the generated package to nuget.org"
        required: true
        default: false
        type: boolean
      confirm_package_id:
        description: "Type Unicode.Bidi to confirm publishing"
        required: false
        default: ""
      run_full_conformance:
        description: "Run full Unicode conformance before packing"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish-nuget-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: "true"
  PACKAGE_ID: Unicode.Bidi
  PACKAGE_OUTPUT: artifacts/packages

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Validate inputs
        shell: bash
        env:
          PACKAGE_VERSION: ${{ inputs.package_version }}
          PUBLISH_TO_NUGET: ${{ inputs.publish_to_nuget }}
          CONFIRM_PACKAGE_ID: ${{ inputs.confirm_package_id }}
        run: |
          set -euo pipefail

          if [[ ! "$PACKAGE_VERSION" =~ ^[0-9]+(\.[0-9]+){2}(-[0-9A-Za-z][0-9A-Za-z.-]*)?(\+[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "::error::package_version must be a SemVer-style NuGet version."
            exit 1
          fi

          if [ "$PUBLISH_TO_NUGET" = "true" ]; then
            if [ "$GITHUB_REF_NAME" != "main" ]; then
              echo "::error::Publishing is only allowed from the main branch."
              exit 1
            fi

            if [ "$CONFIRM_PACKAGE_ID" != "$PACKAGE_ID" ]; then
              echo "::error::Set confirm_package_id to $PACKAGE_ID before publishing."
              exit 1
            fi
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Restore
        run: dotnet restore UnicodeBidiNet.slnx

      - name: Build
        run: dotnet build UnicodeBidiNet.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test UnicodeBidiNet.slnx --configuration Release --no-build --nologo

      - name: Fetch upstream crate
        run: ./tools/fetch-upstream.sh

      - name: Run Rust parity harness
        run: |
          python3 -m py_compile \
            tools/generate_char_data.py \
            tools/parity/run_bidi_parity.py \
            tools/conformance/fetch_unicode_bidi_tests.py \
            tools/conformance/run_unicode_bidi_conformance.py
          python3 tools/parity/run_bidi_parity.py --out-dir artifacts/bidi-parity

      - name: Fetch Unicode conformance data
        if: ${{ inputs.run_full_conformance }}
        run: python3 tools/conformance/fetch_unicode_bidi_tests.py

      - name: Run full Unicode conformance
        if: ${{ inputs.run_full_conformance }}
        run: |
          python3 tools/conformance/run_unicode_bidi_conformance.py \
            --suite both \
            --full \
            --baseline tools/conformance/full-ratchet-baseline.json \
            --out-dir artifacts/bidi-conformance \
            --fail-on-failure \
            --fail-on-regression

      - name: Pack
        env:
          PACKAGE_VERSION: ${{ inputs.package_version }}
        run: |
          set -euo pipefail
          rm -rf "$PACKAGE_OUTPUT"
          dotnet pack src/Unicode.Bidi/Unicode.Bidi.csproj \
            --configuration Release \
            --no-build \
            --output "$PACKAGE_OUTPUT" \
            /p:PackageVersion="$PACKAGE_VERSION"

      - name: Verify package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          packages=("$PACKAGE_OUTPUT"/*.nupkg)
          symbol_packages=("$PACKAGE_OUTPUT"/*.snupkg)

          if [ "${#packages[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one .nupkg in $PACKAGE_OUTPUT, found ${#packages[@]}."
            exit 1
          fi

          if [ "${#symbol_packages[@]}" -gt 1 ]; then
            echo "::error::Expected at most one .snupkg in $PACKAGE_OUTPUT, found ${#symbol_packages[@]}."
            exit 1
          fi

          unzip -p "${packages[0]}" "$PACKAGE_ID.nuspec" > "$PACKAGE_OUTPUT/package.nuspec"

          if ! grep -q "<id>$PACKAGE_ID</id>" "$PACKAGE_OUTPUT/package.nuspec"; then
            echo "::error::Package id is not $PACKAGE_ID."
            exit 1
          fi

          echo "nupkg=${packages[0]}" >> "$GITHUB_OUTPUT"
          if [ "${#symbol_packages[@]}" -eq 1 ]; then
            echo "snupkg=${symbol_packages[0]}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload package artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuget-packages-${{ inputs.package_version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/packages
          if-no-files-found: warn

      - name: Upload parity artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bidi-parity-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/bidi-parity
          if-no-files-found: warn

      - name: Upload conformance artifacts
        if: ${{ always() && inputs.run_full_conformance }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bidi-conformance-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/bidi-conformance
          if-no-files-found: warn

      - name: Write summary
        if: ${{ always() }}
        env:
          PACKAGE_VERSION: ${{ inputs.package_version }}
          PUBLISH_TO_NUGET: ${{ inputs.publish_to_nuget }}
          RUN_FULL_CONFORMANCE: ${{ inputs.run_full_conformance }}
          NUPKG: ${{ steps.package.outputs.nupkg }}
          SNUPKG: ${{ steps.package.outputs.snupkg }}
        run: |
          {
            echo "## NuGet publish workflow"
            echo
            echo "- Package: \`$PACKAGE_ID\`"
            echo "- Version: \`$PACKAGE_VERSION\`"
            echo "- Ref: \`$GITHUB_REF_NAME\`"
            echo "- Full conformance: \`$RUN_FULL_CONFORMANCE\`"
            echo "- Publish requested: \`$PUBLISH_TO_NUGET\`"
            if [ -n "$NUPKG" ]; then
              echo "- Package artifact: \`$NUPKG\`"
            fi
            if [ -n "$SNUPKG" ]; then
              echo "- Symbol package artifact: \`$SNUPKG\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: pack
    if: ${{ inputs.publish_to_nuget }}
    runs-on: ubuntu-latest
    environment: nuget.org
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Validate NuGet environment
        shell: bash
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          set -euo pipefail

          if [ -z "$NUGET_USER" ]; then
            echo "::error::Set NUGET_USER in the nuget.org GitHub environment variables."
            exit 1
          fi

      - name: Download package artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nuget-packages-${{ inputs.package_version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/packages

      - name: Find package artifacts
        id: package
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          packages=("$PACKAGE_OUTPUT"/*.nupkg)
          symbol_packages=("$PACKAGE_OUTPUT"/*.snupkg)

          if [ "${#packages[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one .nupkg in $PACKAGE_OUTPUT, found ${#packages[@]}."
            exit 1
          fi

          if [ "${#symbol_packages[@]}" -gt 1 ]; then
            echo "::error::Expected at most one .snupkg in $PACKAGE_OUTPUT, found ${#symbol_packages[@]}."
            exit 1
          fi

          echo "nupkg=${packages[0]}" >> "$GITHUB_OUTPUT"
          if [ "${#symbol_packages[@]}" -eq 1 ]; then
            echo "snupkg=${symbol_packages[0]}" >> "$GITHUB_OUTPUT"
          fi

      - name: NuGet login (OIDC)
        id: nuget_login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push package to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
          NUPKG: ${{ steps.package.outputs.nupkg }}
          SNUPKG: ${{ steps.package.outputs.snupkg }}
        run: |
          set -euo pipefail

          dotnet nuget push "$NUPKG" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

          if [ -n "$SNUPKG" ]; then
            dotnet nuget push "$SNUPKG" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          fi

      - name: Write publish summary
        if: ${{ always() }}
        env:
          PACKAGE_VERSION: ${{ inputs.package_version }}
          NUGET_USER: ${{ vars.NUGET_USER }}
          NUPKG: ${{ steps.package.outputs.nupkg }}
          SNUPKG: ${{ steps.package.outputs.snupkg }}
        run: |
          {
            echo "## NuGet publish"
            echo
            echo "- Package: \`$PACKAGE_ID\`"
            echo "- Version: \`$PACKAGE_VERSION\`"
            echo "- Environment: \`nuget.org\`"
            echo "- NuGet user: \`$NUGET_USER\`"
            if [ -n "$NUPKG" ]; then
              echo "- Package pushed: \`$NUPKG\`"
            fi
            if [ -n "$SNUPKG" ]; then
              echo "- Symbol package pushed: \`$SNUPKG\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: [pack, publish]
    if: ${{ always() && inputs.publish_to_nuget && needs.pack.result == 'success' && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nuget-packages-${{ inputs.package_version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/packages

      - name: Create or update GitHub release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ inputs.package_version }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          packages=("$PACKAGE_OUTPUT"/*.nupkg)
          symbol_packages=("$PACKAGE_OUTPUT"/*.snupkg)

          if [ "${#packages[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one .nupkg in $PACKAGE_OUTPUT, found ${#packages[@]}."
            exit 1
          fi

          if [ "${#symbol_packages[@]}" -gt 1 ]; then
            echo "::error::Expected at most one .snupkg in $PACKAGE_OUTPUT, found ${#symbol_packages[@]}."
            exit 1
          fi

          tag="v$PACKAGE_VERSION"
          assets=("${packages[0]}")
          if [ "${#symbol_packages[@]}" -eq 1 ]; then
            assets+=("${symbol_packages[0]}")
          fi

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$tag" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$PACKAGE_ID $PACKAGE_VERSION" \
              --generate-notes
          fi

          release_url="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url --jq .url)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "url=$release_url" >> "$GITHUB_OUTPUT"

      - name: Write release summary
        env:
          PACKAGE_VERSION: ${{ inputs.package_version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
        run: |
          {
            echo "## GitHub release"
            echo
            echo "- Package: \`$PACKAGE_ID\`"
            echo "- Version: \`$PACKAGE_VERSION\`"
            echo "- Tag: \`$RELEASE_TAG\`"
            echo "- Release: $RELEASE_URL"
          } >> "$GITHUB_STEP_SUMMARY"
