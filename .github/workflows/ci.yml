name: CI Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore
        run: dotnet restore UnicodeBidiNet.slnx

      - name: Build
        run: dotnet build UnicodeBidiNet.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test UnicodeBidiNet.slnx --configuration Release --no-build --nologo

      - name: Pack
        run: dotnet pack src/Unicode.Bidi/Unicode.Bidi.csproj --configuration Release --no-build --output artifacts/packages

      - name: Fetch upstream crate
        run: ./tools/fetch-upstream.sh

      - name: Parity harness smoke
        run: |
          python3 -m py_compile \
            tools/generate_char_data.py \
            tools/parity/run_bidi_parity.py \
            tools/conformance/fetch_unicode_bidi_tests.py \
            tools/conformance/run_unicode_bidi_conformance.py
          python3 tools/parity/run_bidi_parity.py --out-dir artifacts/bidi-parity

      - name: Parity summary
        if: ${{ always() }}
        run: |
          if [ -f artifacts/bidi-parity/summary.md ]; then
            cat artifacts/bidi-parity/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Bidi parity summary was not generated."
          fi

      - name: Upload parity artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: bidi-parity-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/bidi-parity
