name: Unicode Conformance

on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:
    inputs:
      suite:
        description: "Conformance suite to run"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - character
          - class
      max_cases:
        description: "Maximum cases for bounded runs"
        required: true
        default: "1000"
      full:
        description: "Run the full selected corpus"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Fetch Unicode conformance data
        run: python3 tools/conformance/fetch_unicode_bidi_tests.py

      - name: Run Unicode conformance
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            SUITE="both"
            CASE_ARGS=(--full --baseline tools/conformance/full-ratchet-baseline.json --fail-on-failure)
          elif [ "${{ inputs.full }}" = "true" ]; then
            SUITE="${{ inputs.suite }}"
            if [ "$SUITE" = "both" ]; then
              CASE_ARGS=(--full --baseline tools/conformance/full-ratchet-baseline.json --fail-on-failure)
            else
              CASE_ARGS=(--full --fail-on-failure)
            fi
          else
            SUITE="${{ inputs.suite }}"
            CASE_ARGS=(--max-cases "${{ inputs.max_cases }}")
          fi

          python3 tools/conformance/run_unicode_bidi_conformance.py \
            --suite "$SUITE" \
            "${CASE_ARGS[@]}" \
            --out-dir artifacts/bidi-conformance \
            --fail-on-regression

      - name: Conformance summary
        if: ${{ always() }}
        run: |
          if [ -f artifacts/bidi-conformance/summary.md ]; then
            cat artifacts/bidi-conformance/summary.md
            cat artifacts/bidi-conformance/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Unicode conformance summary was not generated."
          fi

      - name: Upload conformance artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: bidi-conformance-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/bidi-conformance
